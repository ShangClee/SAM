<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAM — Software Automatic Mouth (Web)</title>
<style>
:root {
  --bg: #0d0d12;
  --surface: #16161f;
  --surface2: #1e1e2a;
  --accent: #6c5ce7;
  --accent2: #a29bfe;
  --text: #e2e2e8;
  --text-dim: #8888a0;
  --border: #2a2a3a;
  --ok: #00b894;
  --err: #e17055;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.app {
  width: 100%;
  max-width: 680px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
h1 {
  font-size: 1.8rem;
  font-weight: 700;
  margin-bottom: 4px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.subtitle {
  color: var(--text-dim);
  font-size: 0.85rem;
  margin-bottom: 28px;
}
textarea {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 1rem;
  padding: 14px;
  resize: vertical;
  min-height: 80px;
  font-family: 'Courier New', monospace;
  outline: none;
  transition: border-color 0.2s;
}
textarea:focus { border-color: var(--accent); }
.controls { margin-top: 20px; }
.slider-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}
.slider-row label {
  width: 70px;
  font-size: 0.85rem;
  color: var(--text-dim);
  text-align: right;
  flex-shrink: 0;
}
.slider-row input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 6px;
  background: var(--surface2);
  border-radius: 3px;
  outline: none;
}
.slider-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: 2px solid var(--surface);
  transition: transform 0.15s;
}
.slider-row input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }
.slider-row input[type="range"]::-moz-range-thumb {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: 2px solid var(--surface);
}
.slider-row .val {
  width: 42px;
  text-align: center;
  font-size: 0.85rem;
  color: var(--accent2);
  font-family: 'Courier New', monospace;
  font-weight: 600;
  flex-shrink: 0;
}
.toggle-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 16px 0;
  font-size: 0.85rem;
  color: var(--text-dim);
}
.toggle-row input[type="checkbox"] {
  width: 16px; height: 16px;
  accent-color: var(--accent);
  cursor: pointer;
}
.presets {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
  margin-bottom: 20px;
}
.preset-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.78rem;
  cursor: pointer;
  transition: all 0.2s;
}
.preset-btn:hover {
  border-color: var(--accent);
  color: var(--text);
}
.btn-row { display: flex; gap: 12px; margin-top: 24px; }
.btn {
  flex: 1;
  padding: 14px 24px;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white;
}
.btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn-secondary {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { border-color: var(--accent); }
.status {
  margin-top: 16px;
  font-size: 0.82rem;
  color: var(--text-dim);
  min-height: 1.2em;
  text-align: center;
}
.status.error { color: var(--err); }
.status.ok { color: var(--ok); }
.loading-overlay {
  display: none;
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(13,13,18,0.8);
  z-index: 100;
  align-items: center; justify-content: center;
  flex-direction: column;
  gap: 16px;
}
.loading-overlay.show { display: flex; }
.spinner {
  width: 40px; height: 40px;
  border: 3px solid var(--surface2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.phoneme-display {
  margin-top: 16px;
  font-family: 'Courier New', monospace;
  font-size: 0.8rem;
  color: var(--text-dim);
  word-break: break-all;
  max-height: 80px;
  overflow-y: auto;
  background: var(--surface2);
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  display: none;
}
.phoneme-display.show { display: block; }

/* ── Conversion Info Panels ── */
.conversion-info {
  margin-top: 20px;
  border-top: 1px solid var(--border);
  padding-top: 20px;
  display: none;
}
.info-section { margin-bottom: 16px; }
.info-label {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--accent2);
  margin-bottom: 6px;
}
.info-content {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 0.85rem;
  color: var(--text);
  word-break: break-word;
}
.info-content.mono {
  font-family: 'Courier New', monospace;
  color: var(--accent2);
  letter-spacing: 0.5px;
}
.rule-item {
  font-family: 'Courier New', monospace;
  font-size: 0.8rem;
  padding: 3px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.rule-item:last-child { border-bottom: none; }
.rule-pattern { color: var(--text-dim); }
.rule-arrow { color: var(--accent); margin: 0 8px; }
.rule-result { color: var(--accent2); font-weight: 600; }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div style="color:var(--text-dim);font-size:0.9rem">Loading SAM WASM engine…</div>
</div>

<div class="app">
  <h1>🗣️ SAM</h1>
  <div class="subtitle">Software Automatic Mouth — Text-to-Speech in your browser</div>

  <textarea id="textInput" placeholder="Type something for SAM to say…" rows="3">Hello world! I am SAM, the software automatic mouth.</textarea>

  <div class="controls">
    <div class="slider-row">
      <label>Pitch</label>
      <input type="range" id="pitch" min="0" max="255" value="64">
      <span class="val" id="pitchVal">64</span>
    </div>
    <div class="slider-row">
      <label>Speed</label>
      <input type="range" id="speed" min="0" max="255" value="72">
      <span class="val" id="speedVal">72</span>
    </div>
    <div class="slider-row">
      <label>Mouth</label>
      <input type="range" id="mouth" min="0" max="255" value="128">
      <span class="val" id="mouthVal">128</span>
    </div>
    <div class="slider-row">
      <label>Throat</label>
      <input type="range" id="throat" min="0" max="255" value="128">
      <span class="val" id="throatVal">128</span>
    </div>
  </div>

  <div class="toggle-row">
    <input type="checkbox" id="singmode">
    <label for="singmode">Sing mode</label>
  </div>
  <div class="toggle-row">
    <input type="checkbox" id="phonetic">
    <label for="phonetic">Phonetic input (use SAM phoneme codes, e.g. /HEY2)</label>
  </div>

  <div class="presets">
    <button class="preset-btn" data-preset="sam">SAM</button>
    <button class="preset-btn" data-preset="elf">Elf</button>
    <button class="preset-btn" data-preset="robot">Little Robot</button>
    <button class="preset-btn" data-preset="stuffy">Stuffy Guy</button>
    <button class="preset-btn" data-preset="oldlady">Little Old Lady</button>
    <button class="preset-btn" data-preset="et">Extra-Terrestrial</button>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="speakBtn" disabled>🔊 Speak</button>
    <button class="btn btn-secondary" id="downloadBtn" disabled>⬇ Download WAV</button>
  </div>

  <div class="status" id="status">Loading WASM engine…</div>

  <div class="conversion-info" id="conversionInfo" style="display:none">
    <div class="info-section">
      <div class="info-label">📝 Original Text</div>
      <div class="info-content" id="originalText"></div>
    </div>
    <div class="info-section">
      <div class="info-label">🔤 SAM Phonetic Output</div>
      <div class="info-content mono" id="phoneticOutput"></div>
    </div>
    <div class="info-section">
      <div class="info-label">📐 Rules Applied</div>
      <div class="info-content" id="rulesApplied"></div>
    </div>
  </div>
</div>

<script type="module">
import createSamModule from './sam.js';

let SamModule = null;
let lastWavBlob = null;
let audioCtx = null;
let capturedStdout = [];

// Voice presets from the original SAM manual
const PRESETS = {
  sam:     { pitch: 64,  speed: 72,  mouth: 128, throat: 128 },
  elf:     { pitch: 64,  speed: 72,  mouth: 160, throat: 110 },
  robot:   { pitch: 60,  speed: 92,  mouth: 190, throat: 190 },
  stuffy:  { pitch: 72,  speed: 82,  mouth: 105, throat: 110 },
  oldlady: { pitch: 32,  speed: 82,  mouth: 145, throat: 145 },
  et:      { pitch: 64,  speed: 100, mouth: 200, throat: 150 },
};

// ── UI helpers ──
const $ = id => document.getElementById(id);
const statusEl = $('status');
const speakBtn = $('speakBtn');
const downloadBtn = $('downloadBtn');
const loadingOverlay = $('loadingOverlay');

function setStatus(msg, type = '') {
  statusEl.textContent = msg;
  statusEl.className = 'status' + (type ? ' ' + type : '');
}

// Slider live values
['pitch', 'speed', 'mouth', 'throat'].forEach(name => {
  const slider = $(name);
  const valEl = $(name + 'Val');
  slider.addEventListener('input', () => { valEl.textContent = slider.value; });
});

// Preset buttons
document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const p = PRESETS[btn.dataset.preset];
    Object.entries(p).forEach(([k, v]) => {
      $(k).value = v;
      $(k + 'Val').textContent = v;
    });
  });
});

// ── Load WASM module ──
createSamModule({
  print: function(text) { capturedStdout.push(text); }
}).then(mod => {
  SamModule = mod;
  loadingOverlay.classList.remove('show');
  speakBtn.disabled = false;
  downloadBtn.disabled = false;
  setStatus('Ready! Type something and click Speak.', 'ok');
}).catch(err => {
  loadingOverlay.classList.remove('show');
  setStatus('Failed to load WASM: ' + err.message, 'error');
  console.error(err);
});

// Show loading overlay immediately
loadingOverlay.classList.add('show');

// ── Synthesis ──
function synthesize() {
  const text = $('textInput').value.trim();
  if (!text) { setStatus('Please enter some text.', 'error'); return null; }

  const pitch = parseInt($('pitch').value);
  const speed = parseInt($('speed').value);
  const mouth = parseInt($('mouth').value);
  const throat = parseInt($('throat').value);
  const singmode = $('singmode').checked ? 1 : 0;
  const phonetic = $('phonetic').checked ? 1 : 0;

  // Clear previous debug capture
  capturedStdout = [];

  // Call the C function — ccall handles string→C allocation automatically
  const sampleCount = SamModule.ccall(
    'sam_web_synthesize',
    'number',
    ['string', 'number', 'number', 'number', 'number', 'number', 'number'],
    [text, phonetic, pitch, speed, mouth, throat, singmode]
  );

  if (sampleCount === 0) {
    const errCode = SamModule.ccall('sam_web_get_error', 'number', [], []);
    const errPos = SamModule.ccall('sam_web_get_error_position', 'number', [], []);
    if (phonetic === 1) {
      const bad = errPos >= 0 && errPos < text.length ? `'${text[errPos]}'` : '';
      setStatus(
        `Invalid phoneme code ${bad} at position ${errPos}. ` +
        'SAM codes are two-letter phonemes, e.g. /HEY2 (H is written /H, and 0-8 set stress).',
        'error'
      );
    } else {
      setStatus(`Text could not be converted to phonemes (SAM error ${errCode}). Try simpler words.`, 'error');
    }
    return null;
  }

  // Get buffer pointer and read samples
  const bufPtr = SamModule.ccall('sam_web_get_buffer', 'number', [], []);
  const sampleRate = SamModule.ccall('sam_web_get_sample_rate', 'number', [], []);

  // Read 8-bit unsigned PCM samples from WASM memory
  const samples = new Uint8Array(SamModule.HEAPU8.buffer, bufPtr, sampleCount);

  // Get phonetic output string from C
  const phoneticOutput = SamModule.ccall(
    'sam_web_get_phonetic_output', 'string', [], []
  );

  // Parse rules from captured stdout
  const rules = capturedStdout
    .filter(line => line.startsWith('Applying rule:'))
    .map(line => line.replace('Applying rule: ', ''));

  return {
    samples: samples.slice(), sampleRate, sampleCount,
    originalText: text,
    phoneticOutput: phoneticOutput.trim(),
    rules,
    phoneticMode: phonetic === 1
  };
}

// ── Audio playback ──
function playAudio(samples, sampleRate) {
  if (!audioCtx || audioCtx.state === 'closed') {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();

  // Create an AudioBuffer at the source sample rate
  const audioBuffer = audioCtx.createBuffer(1, samples.length, sampleRate);
  const channelData = audioBuffer.getChannelData(0);

  // Convert 8-bit unsigned PCM → Float32 [-1, 1]
  for (let i = 0; i < samples.length; i++) {
    channelData[i] = (samples[i] - 128) / 128;
  }

  const source = audioCtx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(audioCtx.destination);
  source.onended = () => setStatus('Done.', 'ok');
  source.start();

  setStatus('Playing…', 'ok');
}

// ── WAV blob creation ──
function makeWavBlob(samples, sampleRate) {
  const buffer = new ArrayBuffer(44 + samples.length);
  const view = new DataView(buffer);

  // RIFF header
  writeStr(view, 0, 'RIFF');
  view.setUint32(4, 36 + samples.length, true);
  writeStr(view, 8, 'WAVE');

  // fmt chunk
  writeStr(view, 12, 'fmt ');
  view.setUint32(16, 16, true);        // chunk size
  view.setUint16(20, 1, true);         // PCM format
  view.setUint16(22, 1, true);         // mono
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate, true); // byte rate
  view.setUint16(32, 1, true);         // block align
  view.setUint16(34, 8, true);         // bits per sample

  // data chunk
  writeStr(view, 36, 'data');
  view.setUint32(40, samples.length, true);

  const u8 = new Uint8Array(buffer, 44);
  u8.set(samples);

  return new Blob([buffer], { type: 'audio/wav' });
}

function writeStr(view, offset, str) {
  for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
}

// ── Display conversion info panels ──
function showConversionInfo(result) {
  $('originalText').textContent = result.originalText;
  $('phoneticOutput').textContent = result.phoneticOutput || '(unavailable)';

  if (result.phoneticMode) {
    $('rulesApplied').innerHTML = '<div class="rule-item" style="color:var(--text-dim)">Phonetic input mode — no rules applied</div>';
  } else if (result.rules.length === 0) {
    $('rulesApplied').innerHTML = '<div class="rule-item" style="color:var(--text-dim)">No rules captured</div>';
  } else {
    const html = result.rules.map(rule => {
      const parts = rule.split(/\s+->\s+/);
      if (parts.length === 2) {
        return `<div class="rule-item"><span class="rule-pattern">${parts[0]}</span><span class="rule-arrow">→</span><span class="rule-result">${parts[1]}</span></div>`;
      }
      return `<div class="rule-item">${rule}</div>`;
    }).join('');
    $('rulesApplied').innerHTML = html;
  }

  $('conversionInfo').style.display = 'block';
}

// ── Button handlers ──
speakBtn.addEventListener('click', () => {
  try {
    const result = synthesize();
    if (!result) return;
    setStatus(`Synthesized ${result.sampleCount} samples (${(result.sampleCount / result.sampleRate).toFixed(2)}s)`, 'ok');
    showConversionInfo(result);
    playAudio(result.samples, result.sampleRate);
  } catch(e) {
    console.error('Speak error:', e);
    setStatus('Error: ' + (e.message || e), 'error');
  }
});

downloadBtn.addEventListener('click', () => {
  try {
    const result = synthesize();
    if (!result) return;
    showConversionInfo(result);
    const blob = makeWavBlob(result.samples, result.sampleRate);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sam_output.wav';
    a.click();
    URL.revokeObjectURL(url);
    setStatus('WAV downloaded.', 'ok');
  } catch(e) {
    console.error('Download error:', e);
    setStatus('Error: ' + (e.message || e), 'error');
  }
});

// Enter key to speak
$('textInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    speakBtn.click();
  }
});
</script>
</body>
</html>
